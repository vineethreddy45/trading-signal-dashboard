name: Send Daily and Weekly Signal Email

on:
  schedule:
    # 8 PM Eastern during daylight-saving time
    - cron: "0 0 * * *"

    # 8 PM Eastern during standard time
    - cron: "0 1 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-email:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Log workflow timing
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "UTC time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "ET time: $(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S ET')"

      - name: Validate email secrets
        id: email-secrets
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          missing_vars=()

          for var in SMTP_HOST SMTP_PORT SMTP_USERNAME SMTP_PASSWORD EMAIL_FROM EMAIL_TO; do
            if [ -z "${!var}" ]; then
              echo "$var is missing"
              missing_vars+=("$var")
            else
              echo "$var is set"
            fi
          done

          if [ ${#missing_vars[@]} -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "missing_vars=${missing_vars[*]}" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping email send because required email secrets are missing: ${missing_vars[*]}"
          fi

      - name: Send scheduled email
        if: github.event_name == 'schedule' && steps.email-secrets.outputs.configured == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          echo "Starting scheduled email run..."
          python email_report.py
          echo "Scheduled email workflow completed."

      - name: Send manual test email
        if: github.event_name == 'workflow_dispatch' && steps.email-secrets.outputs.configured == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          echo "Starting manual email test run..."
          python email_report.py --force
          echo "Manual email workflow completed."

      - name: Skip email when secrets are unavailable
        if: steps.email-secrets.outputs.configured != 'true'
        run: |
          echo "Email run skipped because the following required secrets are missing:"
          echo "${{ steps.email-secrets.outputs.missing_vars }}"